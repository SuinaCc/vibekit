appId: com.vibekit.app
productName: VibeKit
copyright: MIT

directories:
  buildResources: build
  output: dist

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${name}-${version}-win-${arch}.${ext}
  icon: build/icon.png

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  hardenedRuntime: true
  icon: build/icon.png

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

asar: false

npmRebuild: false

extraResources:
  - from: build/icon.png
    to: icon.png
  - from: plugins
    to: plugins

files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/.cache"
  - "!**/*.map"
  - "!node_modules/{.package-lock.json,electron*,@types*,typescript,rimraf,electron-*,@electron*}"
  - "!node_modules/**/{docs,test,tests,example,examples,.github,coverage}/**"
