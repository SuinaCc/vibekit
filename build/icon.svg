<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1B26"/>
      <stop offset="1" stop-color="#0B0C12"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#5B6CFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#5B6CFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#5B6CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blockGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cursorGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="228.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- 模块光晕 -->
  <g filter="url(#blockGlow)" opacity="0.5">
    <rect x="130" y="286" width="140" height="140" rx="34" fill="#6366F1"/>
    <rect x="754" y="286" width="140" height="140" rx="34" fill="#D946EF"/>
    <rect x="442" y="598" width="140" height="140" rx="34" fill="#A855F7"/>
  </g>

  <!-- 积木 V：五个插件模块拼成 -->
  <rect x="130" y="286" width="140" height="140" rx="34" fill="#6366F1"/>
  <rect x="754" y="286" width="140" height="140" rx="34" fill="#D946EF"/>
  <rect x="286" y="442" width="140" height="140" rx="34" fill="#8B5CF6"/>
  <rect x="598" y="442" width="140" height="140" rx="34" fill="#C15BF3"/>
  <rect x="442" y="598" width="140" height="140" rx="34" fill="#A855F7"/>

  <!-- 模块高光 -->
  <g fill="#FFFFFF">
    <rect x="146" y="302" width="108" height="26" rx="13" opacity="0.28"/>
    <rect x="770" y="302" width="108" height="26" rx="13" opacity="0.28"/>
    <rect x="302" y="458" width="108" height="26" rx="13" opacity="0.25"/>
    <rect x="614" y="458" width="108" height="26" rx="13" opacity="0.25"/>
    <rect x="458" y="614" width="108" height="26" rx="13" opacity="0.22"/>
  </g>

  <!-- 终端块状光标：底部与 V 收尾块对齐，坐在基线上 -->
  <rect x="598" y="634" width="140" height="104" rx="20" fill="#67E8F9" filter="url(#cursorGlow)"/>
  <rect x="598" y="634" width="140" height="104" rx="20" fill="#67E8F9"/>
  <!-- 光标内嵌高光，模拟玻璃块 -->
  <rect x="610" y="646" width="116" height="20" rx="10" fill="#FFFFFF" opacity="0.4"/>
</svg>
