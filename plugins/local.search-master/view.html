<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-light: #a5b4fc;
    --accent-glow: rgba(99,102,241,.35);
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --text: #f1f2f8;
    --text-2: #a9abc2;
    --muted: #7c7e96;
    --border: rgba(255,255,255,.075);
    --surface: rgba(255,255,255,.035);
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent; color: var(--text);
    font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { height: 100vh; overflow: hidden; }
  .app {
    height: 100%; display: flex; flex-direction: column; gap: 14px;
    padding: 28px 18px 14px;
    background:
      radial-gradient(1000px 480px at 50% -14%, rgba(99,102,241,.16), transparent 70%),
      radial-gradient(680px 340px at 104% 8%, rgba(139,92,246,.09), transparent 62%);
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(99,102,241,.65); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; padding: 0 4px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 20px rgba(99,102,241,.35); }
  .brand-mark svg { width: 20px; height: 20px; color: #fff; }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  .brand p { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .status-pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.035); color: var(--text-2); font: inherit; font-size: 11px; cursor: pointer; transition: all .15s; }
  .status-pill:hover { border-color: rgba(99,102,241,.3); background: rgba(99,102,241,.07); }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 8px rgba(251,191,36,.6); }
  .status-pill.ok { color: #a7f3d0; border-color: rgba(52,211,153,.24); background: rgba(52,211,153,.06); }
  .status-pill.ok .dot { background: var(--success); box-shadow: 0 0 8px rgba(52,211,153,.6); }
  .status-pill.err { color: #fca5a5; border-color: rgba(248,113,113,.24); background: rgba(248,113,113,.06); }
  .status-pill.err .dot { background: var(--danger); box-shadow: 0 0 8px rgba(248,113,113,.6); }

  /* ---------- search ---------- */
  .search-section { flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .search-box { position: relative; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 12px 0 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.035)); box-shadow: 0 10px 34px rgba(0,0,0,.18); transition: border-color .2s, box-shadow .2s, background .2s; }
  .search-box.focused { border-color: rgba(129,140,248,.6); box-shadow: 0 0 0 3px rgba(99,102,241,.16), 0 14px 40px rgba(0,0,0,.24); background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.04)); }
  .search-box .search-icon { width: 20px; height: 20px; color: var(--accent-light); flex-shrink: 0; }
  .search-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; letter-spacing: .01em; }
  .search-box input::placeholder { color: rgba(255,255,255,.27); }
  .shortcut { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04); color: var(--muted); font-size: 10px; white-space: nowrap; flex-shrink: 0; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
  .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .icon-btn.danger:hover { color: #fca5a5; background: rgba(248,113,113,.12); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .chip-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.025); color: var(--text-2); font: inherit; font-size: 11px; cursor: pointer; transition: all .15s; }
  .chip:hover { color: var(--text); border-color: rgba(99,102,241,.3); background: rgba(99,102,241,.07); }
  .chip.active { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgba(99,102,241,.28); }
  .filter-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filter-select { height: 28px; padding: 0 26px 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.08); background-color: rgba(255,255,255,.03); color: var(--text-2); font: inherit; font-size: 11px; outline: none; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237c7e96' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 9px center; transition: all .15s; }
  .filter-select:hover { border-color: rgba(99,102,241,.3); color: var(--text); }
  .path-chip { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 2px 0 0; border-radius: 8px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); max-width: 230px; }
  .path-chip .filter-button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 9px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 11px; cursor: pointer; min-width: 0; }
  .path-chip .filter-button:hover { color: var(--text); }
  .path-chip .filter-button svg { width: 13px; height: 13px; flex-shrink: 0; }
  .path-chip .filter-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path-chip .path-clear { width: 20px; height: 20px; margin-right: 3px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .path-chip .path-clear:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .star-btn { width: 28px; height: 28px; border-radius: 8px; }
  .star-btn.on { color: var(--warning); background: rgba(251,191,36,.08); }

  /* ---------- workspace ---------- */
  .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(350px, .9fr); gap: 14px; }
  .card { background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.025)); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .results-panel, .preview-panel { display: flex; flex-direction: column; min-height: 0; }
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px 11px; border-bottom: 1px solid rgba(255,255,255,.055); flex-shrink: 0; }
  .results-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .results-title h2 { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .results-title span { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spinner-label { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--accent-light); }
  .hidden { display: none !important; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent-light); animation: spin .7s linear infinite; display: inline-block; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results-scroll { flex: 1; min-height: 0; overflow-y: auto; position: relative; scroll-behavior: smooth; }
  .results-list { display: flex; flex-direction: column; padding: 4px; }
  .result-row { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 10px; cursor: default; transition: background .12s; animation: rowIn .24s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 12ms); }
  .result-row:hover { background: rgba(255,255,255,.045); }
  .result-row.selected { background: linear-gradient(90deg, rgba(99,102,241,.18), rgba(99,102,241,.06)); }
  .result-row.selected::before { content: ''; position: absolute; left: 2px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--accent-light); box-shadow: 0 0 8px var(--accent-glow); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .file-tile { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,.08); background: var(--tile-bg, rgba(255,255,255,.05)); color: var(--tile-fg, #c8c9da); font-size: 9px; font-weight: 700; letter-spacing: .02em; overflow: hidden; text-transform: uppercase; }
  .file-tile svg { width: 17px; height: 17px; }
  .file-tile.cat-folder { --tile-bg: rgba(251,191,36,.12); --tile-fg: #fbbf24; }
  .file-tile.cat-image { --tile-bg: rgba(45,212,191,.12); --tile-fg: #5eead4; }
  .file-tile.cat-video { --tile-bg: rgba(168,85,247,.14); --tile-fg: #d8b4fe; }
  .file-tile.cat-audio { --tile-bg: rgba(244,114,182,.12); --tile-fg: #f9a8d4; }
  .file-tile.cat-archive { --tile-bg: rgba(251,191,36,.12); --tile-fg: #fcd34d; }
  .file-tile.cat-code { --tile-bg: rgba(96,165,250,.13); --tile-fg: #93c5fd; }
  .file-tile.cat-document { --tile-bg: rgba(52,211,153,.11); --tile-fg: #6ee7b7; }
  .file-tile.cat-file { --tile-bg: rgba(255,255,255,.055); --tile-fg: #a9abc2; }
  .result-main { min-width: 0; }
  .result-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-path { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .result-size { font-size: 10px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .result-date { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 74px; text-align: right; }
  .results-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 15px; border-top: 1px solid rgba(255,255,255,.055); font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .results-foot span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .load-more { padding: 8px 4px 12px; text-align: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border); background: rgba(255,255,255,.05); color: var(--text); font: inherit; font-size: 11px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.13); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 5px 16px rgba(99,102,241,.25); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-small { height: 28px; padding: 0 10px; font-size: 10px; border-radius: 7px; }

  /* ---------- welcome / states ---------- */
  .welcome { padding: 18px; display: flex; flex-direction: column; gap: 16px; animation: fadeUp .3s ease-out; }
  .welcome-hero { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: radial-gradient(400px 160px at 10% 0%, rgba(99,102,241,.13), transparent 70%), rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.055); }
  .welcome-hero .hero-icon { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.2); color: var(--accent-light); flex-shrink: 0; }
  .welcome-hero .hero-icon svg { width: 23px; height: 23px; }
  .welcome-hero h3 { font-size: 14px; font-weight: 600; }
  .welcome-hero p { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .syntax-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .syntax-chip { font-family: 'Cascadia Code', Consolas, monospace; font-size: 9px; color: var(--accent-light); background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.16); padding: 2px 6px; border-radius: 5px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .section-title h4 { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .location-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .location { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.025); cursor: pointer; transition: all .15s; text-align: left; color: var(--text-2); font: inherit; font-size: 11px; }
  .location:hover { border-color: rgba(99,102,241,.3); background: rgba(99,102,241,.07); color: var(--text); transform: translateY(-1px); }
  .location svg { width: 16px; height: 16px; color: var(--accent-light); flex-shrink: 0; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .query-chip { display: inline-flex; align-items: center; gap: 5px; height: 25px; max-width: 240px; padding: 0 4px 0 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); color: var(--text-2); font: inherit; font-size: 10px; cursor: pointer; transition: all .15s; }
  .query-chip:hover { color: var(--text); border-color: rgba(99,102,241,.3); background: rgba(99,102,241,.07); }
  .query-chip .q-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .query-chip .q-remove { width: 17px; height: 17px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .query-chip .q-remove:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .roadmap { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.05); font-size: 10px; color: var(--muted); }
  .roadmap b { color: var(--text-2); font-weight: 500; }
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 58px 24px; text-align: center; color: var(--muted); font-size: 11px; }
  .empty-state svg { width: 38px; height: 38px; opacity: .35; margin-bottom: 4px; }
  .empty-state h3 { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .skeleton-list { padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; }
  .skeleton-row { display: grid; grid-template-columns: 38px 1fr 80px; gap: 12px; align-items: center; padding: 7px 4px; }
  .skeleton { border-radius: 8px; background: linear-gradient(90deg, rgba(255,255,255,.03) 25%, rgba(255,255,255,.075) 37%, rgba(255,255,255,.03) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  .skeleton.tile { width: 34px; height: 34px; border-radius: 9px; }
  .skeleton.line { height: 10px; }
  .skeleton.line.short { width: 55%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* ---------- setup ---------- */
  .setup { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 34px 30px; max-width: 560px; margin: 0 auto; }
  .setup .setup-icon { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 15px; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.22); color: #fca5a5; }
  .setup .setup-icon svg { width: 25px; height: 25px; }
  .setup h3 { font-size: 16px; font-weight: 700; }
  .setup p { font-size: 12px; line-height: 1.7; color: var(--text-2); }
  .setup ol { margin-left: 18px; color: var(--text-2); font-size: 12px; line-height: 1.9; }
  .setup .hint { font-size: 10px; color: var(--muted); }

  /* ---------- preview ---------- */
  .preview-panel { min-width: 0; }
  .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px 11px; border-bottom: 1px solid rgba(255,255,255,.055); flex-shrink: 0; }
  .preview-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .preview-icon { width: 32px; height: 32px; flex-shrink: 0; }
  .preview-title { min-width: 0; }
  .preview-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-type { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .preview-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .preview-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .preview-visual { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .preview-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; text-align: center; color: var(--muted); padding: 30px; }
  .preview-placeholder svg { width: 42px; height: 42px; opacity: .3; }
  .preview-placeholder p { font-size: 12px; color: var(--text-2); }
  .preview-placeholder span { font-size: 10px; }
  .image-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background-color: rgba(255,255,255,.018); background-image: linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%), linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%); background-size: 18px 18px; background-position: 0 0, 9px 9px; overflow: auto; }
  .image-stage img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.35); object-fit: contain; }
  .code-view { flex: 1; min-height: 0; display: flex; overflow: hidden; background: rgba(8,9,18,.38); }
  .code-gutter { width: 44px; flex-shrink: 0; padding: 12px 8px; border-right: 1px solid rgba(255,255,255,.05); color: rgba(255,255,255,.22); font: 11px/1.65 'Cascadia Code', Consolas, monospace; text-align: right; user-select: none; overflow: hidden; }
  .code-body { flex: 1; min-width: 0; overflow: auto; }
  .code-text { margin: 0; padding: 12px 14px; color: #c9cee6; font: 11px/1.65 'Cascadia Code', Consolas, monospace; white-space: pre; tab-size: 4; }
  .truncated-note { padding: 6px 12px; border-top: 1px solid rgba(255,255,255,.05); color: var(--warning); font-size: 10px; flex-shrink: 0; }
  .unsupported-preview { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 24px; color: var(--muted); }
  .unsupported-preview .big-icon { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); color: var(--text-2); font-size: 16px; font-weight: 700; }
  .unsupported-preview h3 { font-size: 13px; color: var(--text-2); font-weight: 600; }
  .unsupported-preview p { font-size: 11px; max-width: 300px; line-height: 1.6; }
  .meta-list { flex-shrink: 0; border-top: 1px solid rgba(255,255,255,.055); padding: 10px 15px 12px; display: flex; flex-direction: column; gap: 7px; }
  .meta-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 10px; }
  .meta-row .k { color: var(--muted); flex-shrink: 0; }
  .meta-row .v { color: var(--text-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta-row .v.path { white-space: normal; word-break: break-all; text-align: right; }
  .preview-loading { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 11px; }

  /* ---------- modal / menu / toast ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(4,5,12,.68); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
  .modal-box { width: min(400px, 100%); background: #15162a; border: 1px solid rgba(99,102,241,.22); border-radius: 16px; padding: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.55); animation: fadeUp .18s ease-out; }
  .modal-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .modal-box input { width: 100%; height: 38px; padding: 0 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: var(--text); font: inherit; font-size: 12px; outline: none; }
  .modal-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .ctx-menu { position: fixed; z-index: 400; min-width: 170px; padding: 4px; border-radius: 10px; background: rgba(21,22,42,.98); border: 1px solid rgba(99,102,241,.22); box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .ctx-menu button { display: block; width: 100%; padding: 7px 11px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 11px; text-align: left; cursor: pointer; }
  .ctx-menu button:hover { background: rgba(99,102,241,.14); color: var(--text); }
  .ctx-menu .sep { height: 1px; margin: 3px 4px; background: rgba(255,255,255,.07); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(10px); background: rgba(21,22,42,.98); border: 1px solid rgba(255,255,255,.12); color: var(--text); padding: 9px 16px; border-radius: 10px; font-size: 12px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 500; max-width: 80vw; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.warn { border-color: rgba(251,191,36,.32); color: #fcd34d; }
  .toast.ok { border-color: rgba(52,211,153,.3); color: #6ee7b7; }

  @media (max-width: 980px) {
    .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 1.2fr) minmax(260px, .8fr); }
    .preview-panel { min-height: 260px; }
    .location-grid { grid-template-columns: repeat(2, 1fr); }
    .filter-row { align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/><path d="M12.5 7.2 10 10.8h2.4L10.9 14"/></svg>
      </div>
      <div><h1>搜索大师</h1><p>Everything 本地索引 · 毫秒级文件搜索</p></div>
    </div>
    <button class="status-pill" id="statusPill" title="点击重新检测 Everything">
      <i class="dot"></i><span id="statusText">检测中…</span>
    </button>
  </header>

  <section class="search-section">
    <div class="search-box" id="searchBox">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜索文件名、路径，或使用 ext: size: dm: 等 Everything 语法" autocomplete="off" spellcheck="false">
      <span class="shortcut" id="focusHint" title="聚焦搜索">Ctrl K</span>
      <button class="icon-btn hidden" id="btnClear" title="清空">×</button>
    </div>

    <div class="filter-row">
      <div class="chip-group" id="typeChips">
        <button class="chip active" data-type="all">全部</button>
        <button class="chip" data-type="files">文件</button>
        <button class="chip" data-type="folders">文件夹</button>
        <button class="chip" data-type="image">图片</button>
        <button class="chip" data-type="document">文档</button>
        <button class="chip" data-type="video">视频</button>
        <button class="chip" data-type="audio">音频</button>
        <button class="chip" data-type="archive">压缩包</button>
        <button class="chip" data-type="code">代码</button>
      </div>
      <div class="filter-actions">
        <select class="filter-select" id="sizeFilter" title="大小筛选">
          <option value="any">大小 · 不限</option>
          <option value="gt10mb">大于 10 MB</option>
          <option value="gt100mb">大于 100 MB</option>
          <option value="gt1gb">大于 1 GB</option>
        </select>
        <select class="filter-select" id="dateFilter" title="修改时间筛选">
          <option value="any">时间 · 不限</option>
          <option value="today">今天修改</option>
          <option value="week">本周修改</option>
          <option value="month">本月修改</option>
        </select>
        <select class="filter-select" id="sortSelect" title="排序">
          <option value="name-ascending">名称 A→Z</option>
          <option value="name-descending">名称 Z→A</option>
          <option value="date-modified-descending">最近修改</option>
          <option value="size-descending">大小从大到小</option>
        </select>
        <div class="path-chip">
          <button class="filter-button" id="pathFilter" title="选择搜索位置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span id="pathLabel">所有位置</span>
          </button>
          <button class="path-clear hidden" id="pathClear" title="清除位置">×</button>
        </div>
        <button class="icon-btn star-btn" id="btnSaveSearch" title="收藏当前搜索">☆</button>
      </div>
    </div>
  </section>

  <main class="workspace">
    <section class="card results-panel">
      <div class="results-head">
        <div class="results-title"><h2>搜索结果</h2><span id="resultMeta">等待搜索</span></div>
        <span class="spinner-label hidden" id="searchSpinner"><span class="spin"></span>搜索中</span>
      </div>
      <div class="results-scroll" id="resultsScroll">
        <div id="setupState" class="setup hidden"></div>
        <div id="welcome" class="welcome"></div>
        <div id="resultsSkeleton" class="skeleton-list hidden"></div>
        <div id="resultsList" class="results-list hidden"></div>
        <div id="resultsEmpty" class="empty-state hidden"></div>
        <div id="loadMoreWrap" class="load-more hidden"><button class="btn" id="btnLoadMore">加载更多</button></div>
      </div>
      <div class="results-foot">
        <span id="footStatus">Everything 未连接</span>
        <span>↑↓ 选择 · Enter 打开 · Ctrl+Enter 定位 · 右键更多</span>
      </div>
    </section>

    <aside class="card preview-panel" id="previewPanel">
      <div class="preview-head">
        <div class="preview-title-wrap">
          <div class="preview-icon file-tile cat-file" id="previewIcon">?</div>
          <div class="preview-title">
            <div class="preview-name" id="previewName">未选择文件</div>
            <div class="preview-type" id="previewType">选择左侧结果查看预览</div>
          </div>
        </div>
        <div class="preview-actions hidden" id="previewActions">
          <button class="icon-btn" id="btnOpen" title="打开 (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M21 3 10 14"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
          </button>
          <button class="icon-btn" id="btnReveal" title="在资源管理器中显示 (Ctrl+Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 3-3 3 3"/></svg>
          </button>
          <button class="icon-btn" id="btnCopyPath" title="复制路径">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
        </div>
      </div>
      <div class="preview-body" id="previewBody">
        <div class="preview-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
          <p>选择文件查看即时预览</p>
          <span>文本 · 图片 · 元数据</span>
        </div>
      </div>
    </aside>
  </main>
</div>

<div id="modal"></div>
<div id="ctxMenu" class="ctx-menu hidden"></div>
<div id="toast" class="toast"></div>

<script src="app://__vibekit__/bridge.js?pluginId=local.search-master"></script>
<script>
(function () {
  'use strict';

  var PAGE_SIZE = 100;
  var state = {
    query: '', kind: 'all', fileType: 'all', size: 'any', date: 'any',
    path: null, sort: 'name-ascending', results: [], total: null,
    selected: -1, loading: false, hasMore: false, seq: 0, elapsed: 0,
    available: false, saved: [], recent: [], status: null,
  };
  var previewSeq = 0;
  var previewCache = new Map();
  var searchTimer = null;
  var searchScrollHandlerBound = false;
  var activeMenuIndex = -1;

  var IMAGE_EXT = new Set(['jpg','jpeg','png','gif','webp','bmp','svg','ico','avif','tif','tiff']);
  var VIDEO_EXT = new Set(['mp4','m4v','mkv','avi','mov','webm','wmv','flv','ts']);
  var AUDIO_EXT = new Set(['mp3','flac','wav','aac','ogg','m4a','wma','ape']);
  var ARCHIVE_EXT = new Set(['zip','rar','7z','tar','gz','bz2','xz','iso','cab']);
  var CODE_EXT = new Set(['js','jsx','ts','tsx','mjs','cjs','json','html','htm','css','scss','less','py','go','rs','java','kt','c','cpp','h','hpp','cs','php','rb','sh','ps1','bat','cmd','vue','svelte','yml','yaml','toml','xml','sql']);
  var DOC_EXT = new Set(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','rtf','csv','tsv','epub','one']);

  function $(id) { return document.getElementById(id); }
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toast(message, cls) {
    var el = $('toast');
    el.textContent = message;
    el.className = 'toast show' + (cls ? ' ' + cls : '');
    clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.className = 'toast'; }, 2400);
  }
  function fmtSize(bytes) {
    if (bytes == null || !Number.isFinite(bytes) || bytes < 0) return '—';
    if (bytes === 0) return '0 B';
    var units = ['B','KB','MB','GB','TB'];
    var i = 0;
    var value = bytes;
    while (value >= 1024 && i < units.length - 1) { value /= 1024; i += 1; }
    return (value >= 100 ? value.toFixed(0) : value >= 10 ? value.toFixed(1) : value.toFixed(2)) + ' ' + units[i];
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function baseName(p) {
    var text = String(p == null ? '' : p);
    var parts = text.split(/[\/]/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : text;
  }
  function prettyPathName(p) {
    var base = baseName(p);
    var names = { Desktop: '桌面', Downloads: '下载', Documents: '文档', Pictures: '图片', Music: '音乐', Videos: '视频' };
    return names[base] || base || '所有位置';
  }
  function fmtNumber(n) { return n == null ? '—' : Number(n).toLocaleString('zh-CN'); }
  function typeLabel(ext) { return ext ? ext.toUpperCase() : '文件'; }
  function categoryOf(item) {
    if (item.isFolder) return 'folder';
    var ext = (item.extension || '').toLowerCase();
    if (IMAGE_EXT.has(ext)) return 'image';
    if (VIDEO_EXT.has(ext)) return 'video';
    if (AUDIO_EXT.has(ext)) return 'audio';
    if (ARCHIVE_EXT.has(ext)) return 'archive';
    if (CODE_EXT.has(ext)) return 'code';
    if (DOC_EXT.has(ext)) return 'document';
    return 'file';
  }
  function folderIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  }
  function tileFor(item) {
    var cat = categoryOf(item);
    if (cat === 'folder') {
      return '<div class="file-tile cat-folder">' + folderIconSvg() + '</div>';
    }
    var label = item.extension ? item.extension.slice(0, 4).toUpperCase() : '•';
    return '<div class="file-tile cat-' + cat + '">' + esc(label) + '</div>';
  }
  function categoryTitle(item) {
    var cat = categoryOf(item);
    var map = { folder: '文件夹', image: '图片', video: '视频', audio: '音频', archive: '压缩包', code: '代码', document: '文档', file: '文件' };
    return map[cat] + (item.extension && cat !== 'folder' ? ' · ' + item.extension.toUpperCase() : '');
  }

  // ---------- status ----------

  async function checkStatus() {
    var pill = $('statusPill');
    pill.className = 'status-pill';
    $('statusText').textContent = '检测中…';
    try {
      var status = await vibekit.search.status();
      state.status = status;
      state.available = !!status.available;
      if (status.available) {
        pill.className = 'status-pill ok';
        $('statusText').textContent = 'Everything ' + (status.everythingVersion || '') + ' · 已连接';
        $('footStatus').textContent = 'Everything ' + (status.everythingVersion || '') + ' · ES ' + (status.esVersion || '') + ' · 本地索引';
        hideSetup();
        enableSearch(true);
        renderWelcome();
      } else {
        pill.className = 'status-pill err';
        $('statusText').textContent = 'Everything 未连接';
        $('footStatus').textContent = 'Everything 未连接';
        enableSearch(false);
        showSetup(status.error || '未检测到 Everything');
      }
    } catch (err) {
      pill.className = 'status-pill err';
      $('statusText').textContent = 'Everything 未连接';
      $('footStatus').textContent = 'Everything 未连接';
      enableSearch(false);
      showSetup(err.message);
    }
  }

  function enableSearch(enabled) {
    $('searchInput').disabled = !enabled;
    $('btnClear').disabled = !enabled;
    if (enabled) setTimeout(function () { $('searchInput').focus(); }, 60);
  }

  function showSetup(message) {
    $('welcome').classList.add('hidden');
    $('resultsList').classList.add('hidden');
    $('resultsSkeleton').classList.add('hidden');
    $('resultsEmpty').classList.add('hidden');
    $('loadMoreWrap').classList.add('hidden');
    $('resultMeta').textContent = '未连接';
    var el = $('setupState');
    el.classList.remove('hidden');
    el.innerHTML =
      '<div class="setup-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg></div>'
      + '<h3>未连接到 Everything</h3>'
      + '<p>' + esc(message || '请确认 Everything 已安装并正在运行。') + '</p>'
      + '<ol><li>安装 <b>Everything</b>（voidtools）。</li><li>启动 Everything，确保 Everything 服务正常运行。</li><li>搜索大师已内置 ES 命令行组件，无需额外安装。</li></ol>'
      + '<div style="display:flex;gap:8px"><button class="btn btn-primary" id="btnRetryStatus">重新检测</button></div>'
      + '<p class="hint">如仍无法连接，请尝试重启 Everything 或重启本应用。</p>';
    $('btnRetryStatus').addEventListener('click', checkStatus);
  }

  function hideSetup() {
    $('setupState').classList.add('hidden');
  }

  // ---------- search ----------

  function hasCriteria() {
    return !!state.query.trim() || state.kind !== 'all' || state.fileType !== 'all'
      || state.size !== 'any' || state.date !== 'any' || !!state.path;
  }

  function scheduleSearch(reset, delay) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { runSearch(reset); }, delay == null ? 110 : delay);
  }

  async function runSearch(reset) {
    if (!state.available) { checkStatus(); return; }
    if (!hasCriteria()) { showWelcome(); return; }
    var seq = ++state.seq;
    state.loading = true;
    if (reset) {
      state.results = [];
      state.total = null;
      state.selected = -1;
      state.hasMore = false;
      state.elapsed = 0;
      hideSetup();
      $('resultsEmpty').classList.add('hidden');
      $('resultsList').classList.add('hidden');
      $('welcome').classList.add('hidden');
      showSkeleton();
    }
    $('searchSpinner').classList.remove('hidden');
    updateResultMeta();
    if (reset) renderPreviewEmpty();
    var params = {
      query: state.query,
      kind: state.kind,
      fileType: state.fileType,
      size: state.size,
      date: state.date,
      path: state.path,
      sort: state.sort,
      offset: reset ? 0 : state.results.length,
      limit: PAGE_SIZE,
    };
    try {
      var res = await vibekit.search.query(params);
      if (seq !== state.seq) return;
      state.loading = false;
      state.elapsed = res.elapsedMs;
      state.total = res.total;
      if (reset) state.results = res.results;
      else state.results = state.results.concat(res.results);
      state.hasMore = res.results.length === PAGE_SIZE && (res.total == null || state.results.length < res.total);
      hideSkeleton();
      $('searchSpinner').classList.add('hidden');
      renderResults(reset);
      if (reset && res.results.length && state.selected < 0) selectIndex(0, false);
      if (!state.results.length) showEmpty('没有找到匹配项', '试试更换关键词，或使用 Everything 语法如 ext:pdf、size:>100mb。');
      else $('resultsEmpty').classList.add('hidden');
      updateResultMeta();
      if (reset) addRecentSearch();
    } catch (err) {
      if (seq !== state.seq) return;
      state.loading = false;
      $('searchSpinner').classList.add('hidden');
      hideSkeleton();
      showEmpty('搜索失败', err.message || '请检查 Everything 是否正在运行。');
      toast('搜索失败：' + (err.message || '未知错误'), 'warn');
      if (/everything|未运行|未安装/i.test(err.message || '')) {
        state.available = false;
        showSetup(err.message);
      }
    }
  }

  function showSkeleton() {
    var el = $('resultsSkeleton');
    var html = '';
    for (var i = 0; i < 8; i += 1) {
      html += '<div class="skeleton-row"><div class="skeleton tile"></div><div><div class="skeleton line" style="width:' + (45 + (i * 7) % 40) + '%"></div><div class="skeleton line short" style="margin-top:7px"></div></div><div class="skeleton line"></div></div>';
    }
    el.innerHTML = html;
    el.classList.remove('hidden');
  }
  function hideSkeleton() { $('resultsSkeleton').classList.add('hidden'); }

  function showWelcome() {
    state.results = [];
    state.total = null;
    state.selected = -1;
    state.hasMore = false;
    $('resultsList').classList.add('hidden');
    $('resultsEmpty').classList.add('hidden');
    $('loadMoreWrap').classList.add('hidden');
    hideSkeleton();
    hideSetup();
    $('welcome').classList.remove('hidden');
    $('resultMeta').textContent = '等待搜索';
    renderPreviewEmpty();
    renderWelcome();
  }

  function showEmpty(title, message) {
    $('resultsList').classList.add('hidden');
    $('loadMoreWrap').classList.add('hidden');
    $('welcome').classList.add('hidden');
    hideSkeleton();
    var el = $('resultsEmpty');
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>'
      + '<h3>' + esc(title) + '</h3><p>' + esc(message) + '</p>';
    el.classList.remove('hidden');
    $('resultMeta').textContent = '0 项结果';
  }

  function updateResultMeta() {
    var meta = $('resultMeta');
    if (state.loading) { meta.textContent = '搜索中…'; return; }
    if (!state.results.length) { meta.textContent = hasCriteria() ? '0 项结果' : '等待搜索'; return; }
    var totalText = state.total == null ? ('已显示 ' + state.results.length + ' 项') : ('共 ' + fmtNumber(state.total) + ' 项');
    meta.textContent = totalText + ' · ' + state.elapsed + ' ms';
  }

  // ---------- results ----------

  function renderResults(reset) {
    var list = $('resultsList');
    list.classList.remove('hidden');
    if (reset) list.innerHTML = '';
    var start = reset ? 0 : list.children.length;
    var html = '';
    for (var i = start; i < state.results.length; i += 1) {
      var item = state.results[i];
      html += '<div class="result-row' + (i === state.selected ? ' selected' : '') + '" data-index="' + i + '" style="--i:' + Math.min(i - start, 20) + '" title="' + esc(item.fullPath) + '">'
        + tileFor(item)
        + '<div class="result-main"><div class="result-name">' + esc(item.name) + '</div><div class="result-path">' + esc(item.path || item.fullPath) + '</div></div>'
        + '<div class="result-size">' + (item.isFolder ? '文件夹' : fmtSize(item.size)) + '</div>'
        + '<div class="result-date">' + fmtDate(item.modified) + '</div>'
        + '</div>';
    }
    list.insertAdjacentHTML('beforeend', html);
    bindResultRows();
    $('loadMoreWrap').classList.toggle('hidden', !state.hasMore);
  }

  function bindResultRows() {
    Array.prototype.forEach.call($('resultsList').querySelectorAll('.result-row'), function (row) {
      if (row.dataset.bound) return;
      row.dataset.bound = '1';
      var index = Number(row.getAttribute('data-index'));
      row.addEventListener('click', function () { selectIndex(index, false); });
      row.addEventListener('dblclick', function () { selectIndex(index, false); openSelected(); });
      row.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        selectIndex(index, false);
        showContextMenu(e.clientX, e.clientY, index);
      });
    });
  }

  function updateSelection() {
    Array.prototype.forEach.call($('resultsList').querySelectorAll('.result-row'), function (row) {
      row.classList.toggle('selected', Number(row.getAttribute('data-index')) === state.selected);
    });
  }

  function selectIndex(index, scroll) {
    if (index < 0 || index >= state.results.length) return;
    state.selected = index;
    updateSelection();
    var row = $('resultsList').querySelector('[data-index="' + index + '"]');
    if (row && scroll !== false) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    loadPreview(state.results[index]);
  }

  function selectedItem() {
    return state.selected >= 0 && state.selected < state.results.length ? state.results[state.selected] : null;
  }

  async function openSelected() {
    var item = selectedItem();
    if (!item) return;
    try { await vibekit.shell.openPath(item.fullPath); }
    catch (e) { toast('打开失败：' + e.message, 'warn'); }
  }

  async function revealSelected() {
    var item = selectedItem();
    if (!item) return;
    try { await vibekit.search.reveal(item.fullPath); }
    catch (e) { toast('定位失败：' + e.message, 'warn'); }
  }

  async function copyPath(item) {
    if (!item) return;
    try {
      await vibekit.clipboard.write(item.fullPath);
      toast('路径已复制', 'ok');
    } catch (e) { toast('复制失败：' + e.message, 'warn'); }
  }

  // ---------- preview ----------

  function renderPreviewEmpty() {
    $('previewIcon').className = 'preview-icon file-tile cat-file';
    $('previewIcon').textContent = '?';
    $('previewName').textContent = '未选择文件';
    $('previewType').textContent = '选择左侧结果查看预览';
    $('previewActions').classList.add('hidden');
    $('previewBody').innerHTML = '<div class="preview-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg><p>选择文件查看即时预览</p><span>文本 · 图片 · 元数据</span></div>';
  }

  async function loadPreview(item) {
    var seq = ++previewSeq;
    renderPreviewHeader(item);
    var cached = previewCache.get(item.fullPath);
    if (cached) { renderPreviewBody(cached); return; }
    $('previewBody').innerHTML = '<div class="preview-loading"><span class="spin"></span>加载预览…</div>';
    try {
      var preview = await vibekit.search.preview(item.fullPath);
      if (seq !== previewSeq) return;
      var tooBig = preview.kind === 'image' && preview.dataUrl && preview.dataUrl.length > 2_500_000;
      if (!tooBig) {
        if (previewCache.size > 10) previewCache.delete(previewCache.keys().next().value);
        previewCache.set(item.fullPath, preview);
      }
      renderPreviewBody(preview);
    } catch (err) {
      if (seq !== previewSeq) return;
      $('previewBody').innerHTML = '<div class="unsupported-preview"><div class="big-icon">!</div><h3>无法预览</h3><p>' + esc(err.message) + '</p></div>';
    }
  }

  function renderPreviewHeader(item) {
    var cat = categoryOf(item);
    var icon = $('previewIcon');
    icon.className = 'preview-icon file-tile cat-' + cat;
    icon.innerHTML = cat === 'folder' ? folderIconSvg() : esc(item.extension ? item.extension.slice(0, 4).toUpperCase() : '•');
    $('previewName').textContent = item.name;
    $('previewType').textContent = categoryTitle(item);
    $('previewActions').classList.remove('hidden');
  }

  function renderPreviewBody(preview) {
    var body = $('previewBody');
    var html = '<div class="preview-visual">';
    if (preview.kind === 'text') {
      html += '<div class="code-view"><div class="code-gutter" id="codeGutter"></div><div class="code-body"><pre class="code-text" id="codeText"></pre></div></div>';
      if (preview.truncated) html += '<div class="truncated-note">文件较大，仅显示前 256 KB 内容</div>';
    } else if (preview.kind === 'image' && preview.dataUrl) {
      html += '<div class="image-stage"><img src="' + preview.dataUrl.replace(/"/g, '&quot;') + '" alt=""></div>';
    } else if (preview.kind === 'image') {
      html += unsupportedHtml('图片', preview.error || '图片过大，无法直接预览', preview);
    } else if (preview.kind === 'pdf') {
      html += unsupportedHtml('PDF', 'PDF 预览即将推出，当前可查看元数据或直接打开。', preview);
    } else if (preview.kind === 'video') {
      html += unsupportedHtml('视频', '视频预览即将推出，当前可查看元数据或直接打开。', preview);
    } else if (preview.kind === 'audio') {
      html += unsupportedHtml('音频', '音频预览即将推出，当前可查看元数据或直接打开。', preview);
    } else if (preview.kind === 'folder') {
      html += '<div class="unsupported-preview"><div class="big-icon">DIR</div><h3>文件夹</h3><p>双击打开文件夹，或使用右侧按钮在资源管理器中定位。</p></div>';
    } else if (preview.kind === 'binary') {
      html += unsupportedHtml(typeLabel(preview.extension), '二进制文件，暂不支持内容预览。', preview);
    } else if (preview.kind === 'error') {
      html += '<div class="unsupported-preview"><div class="big-icon">!</div><h3>无法读取文件</h3><p>' + esc(preview.error || '文件可能已被移动或删除') + '</p></div>';
    } else {
      html += unsupportedHtml(typeLabel(preview.extension), '该格式暂不支持预览，更多格式即将推出。', preview);
    }
    html += '</div>';
    html += '<div class="meta-list">'
      + metaRow('类型', categoryTitle(preview))
      + metaRow('大小', preview.isFolder ? '—' : fmtSize(preview.size))
      + metaRow('修改时间', fmtDate(preview.modified))
      + metaRow('创建时间', fmtDate(preview.created))
      + '<div class="meta-row"><span class="k">路径</span><span class="v path" title="' + esc(preview.fullPath) + '">' + esc(preview.fullPath) + '</span></div>'
      + '</div>';
    body.innerHTML = html;
    if (preview.kind === 'text') {
      var lines = String(preview.text || '').split(/\r?\n/);
      var shown = Math.min(lines.length, 5000);
      var code = $('codeText');
      var gutter = $('codeGutter');
      code.textContent = lines.slice(0, shown).join('\n');
      var numbers = [];
      for (var i = 1; i <= shown; i += 1) numbers.push(i);
      gutter.textContent = numbers.join('\n');
      var scroller = code.parentElement;
      if (scroller) scroller.addEventListener('scroll', function () { gutter.scrollTop = scroller.scrollTop; });
      if (shown < lines.length) {
        var note = document.createElement('div');
        note.className = 'truncated-note';
        note.textContent = '内容较长，仅显示前 ' + shown + ' 行';
        body.querySelector('.preview-visual').appendChild(note);
      }
    }
  }

  function unsupportedHtml(label, message, preview) {
    return '<div class="unsupported-preview"><div class="big-icon">' + esc(String(label || '').slice(0, 5)) + '</div><h3>' + esc(label || '文件') + ' 预览</h3><p>' + esc(message) + '</p><span class="hint">即将推出更多格式预览</span></div>';
  }

  function metaRow(key, value) {
    return '<div class="meta-row"><span class="k">' + esc(key) + '</span><span class="v" title="' + esc(value) + '">' + esc(value) + '</span></div>';
  }

  // ---------- welcome / saved / recent ----------

  async function loadSaved() {
    try {
      var saved = await vibekit.storage.get('searchMasterSaved');
      if (Array.isArray(saved)) state.saved = saved;
      var recent = await vibekit.storage.get('searchMasterRecent');
      if (Array.isArray(recent)) state.recent = recent;
    } catch { /* ignore */ }
    renderWelcome();
  }

  function snapshot() {
    return { query: state.query, kind: state.kind, fileType: state.fileType, size: state.size, date: state.date, path: state.path, sort: state.sort };
  }
  function snapshotKey(s) {
    return JSON.stringify([s.query, s.kind, s.fileType, s.size, s.date, s.path, s.sort]);
  }
  function applySnapshot(s) {
    state.query = s.query || '';
    state.kind = s.kind || 'all';
    state.fileType = s.fileType || 'all';
    state.size = s.size || 'any';
    state.date = s.date || 'any';
    state.path = s.path || null;
    state.sort = s.sort || 'name-ascending';
    $('searchInput').value = state.query;
    $('btnClear').classList.toggle('hidden', !state.query);
    $('sizeFilter').value = state.size;
    $('dateFilter').value = state.date;
    $('sortSelect').value = state.sort;
    $('pathLabel').textContent = state.path ? prettyPathName(state.path) : '所有位置';
    $('pathClear').classList.toggle('hidden', !state.path);
    updateChips();
    runSearch(true);
  }

  async function addRecentSearch() {
    if (!hasCriteria()) return;
    var entry = Object.assign({ id: 'recent-' + Date.now() }, snapshot());
    state.recent = [entry].concat(state.recent.filter(function (r) { return snapshotKey(r) !== snapshotKey(entry); })).slice(0, 8);
    try { await vibekit.storage.set('searchMasterRecent', state.recent); } catch { /* ignore */ }
    renderRecentChips();
  }

  async function saveSearch() {
    var current = snapshot();
    var existing = state.saved.find(function (s) { return snapshotKey(s) === snapshotKey(current); });
    if (existing) {
      state.saved = state.saved.filter(function (s) { return s.id !== existing.id; });
      try { await vibekit.storage.set('searchMasterSaved', state.saved); } catch { /* ignore */ }
      toast('已取消收藏', 'ok');
      renderWelcome();
      updateStar();
      return;
    }
    openSaveModal();
  }

  function openSaveModal() {
    var modal = $('modal');
    var defaultName = state.query.trim() || (state.path ? prettyPathName(state.path) : '全部文件');
    modal.innerHTML = '<div class="modal-overlay"><div class="modal-box"><h3>收藏当前搜索</h3><input id="savedName" maxlength="40" placeholder="给这个搜索起个名字" value="' + esc(defaultName) + '"><div class="modal-actions"><button class="btn" id="savedCancel">取消</button><button class="btn btn-primary" id="savedOk">收藏</button></div></div></div>';
    var input = $('savedName');
    input.focus();
    input.select();
    function close() { modal.innerHTML = ''; }
    $('savedCancel').addEventListener('click', close);
    $('savedOk').addEventListener('click', async function () {
      var name = input.value.trim() || defaultName;
      var entry = Object.assign({ id: 'saved-' + Date.now(), name: name }, snapshot());
      state.saved = [entry].concat(state.saved).slice(0, 30);
      try { await vibekit.storage.set('searchMasterSaved', state.saved); } catch { /* ignore */ }
      close();
      toast('已收藏搜索', 'ok');
      renderWelcome();
      updateStar();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('savedOk').click();
      if (e.key === 'Escape') close();
    });
  }

  function updateStar() {
    var current = snapshot();
    var on = state.saved.some(function (s) { return snapshotKey(s) === snapshotKey(current); });
    $('btnSaveSearch').classList.toggle('on', on);
    $('btnSaveSearch').textContent = on ? '★' : '☆';
  }

  async function removeSaved(id) {
    state.saved = state.saved.filter(function (s) { return s.id !== id; });
    try { await vibekit.storage.set('searchMasterSaved', state.saved); } catch { /* ignore */ }
    renderWelcome();
    updateStar();
  }

  function renderWelcome() {
    var el = $('welcome');
    if (!el) return;
    if (!state.available) return;
    var home = '';
    el.innerHTML =
      '<div class="welcome-hero"><div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/><path d="M12.5 7.2 10 10.8h2.4L10.9 14"/></svg></div>'
      + '<div><h3>输入关键词，瞬间找到文件</h3><p>Everything 本地索引 · 毫秒级响应 · 支持 Everything 高级语法</p>'
      + '<div class="syntax-chips"><span class="syntax-chip">ext:pdf</span><span class="syntax-chip">size:>100mb</span><span class="syntax-chip">dm:today</span><span class="syntax-chip">folder:node_modules</span><span class="syntax-chip">path:D:\\</span></div></div></div>'
      + '<div><div class="section-title"><h4>快捷位置</h4></div><div class="location-grid" id="quickLocations"></div></div>'
      + '<div><div class="section-title"><h4>收藏搜索</h4><span class="hint">' + (state.saved.length ? '' : '用搜索框右侧 ☆ 收藏') + '</span></div><div class="chip-list" id="savedSearches"></div></div>'
      + '<div><div class="section-title"><h4>最近搜索</h4></div><div class="chip-list" id="recentSearches"></div></div>'
      + '<div class="roadmap"><b>即将推出</b> PDF / Office / 视频预览 · 增强搜索 · 实用工具 · 性能优化</div>';
    renderQuickLocations();
    renderSavedChips();
    renderRecentChips();
    updateStar();
    loadHomeForLocations();
  }

  var quickLocations = [];
  async function loadHomeForLocations() {
    if (quickLocations.length) return;
    try {
      var env = await vibekit.system.getEnv();
      var homePath = env && env.home ? env.home : '';
      quickLocations = [
        { name: '桌面', path: homePath ? homePath + '\\Desktop' : null },
        { name: '下载', path: homePath ? homePath + '\\Downloads' : null },
        { name: '文档', path: homePath ? homePath + '\\Documents' : null },
        { name: '图片', path: homePath ? homePath + '\\Pictures' : null },
      ];
    } catch {
      quickLocations = [];
    }
    renderQuickLocations();
  }
  function renderQuickLocations() {
    var el = $('quickLocations');
    if (!el) return;
    el.innerHTML = (quickLocations.length ? quickLocations : [{ name: '桌面', path: null }, { name: '下载', path: null }, { name: '文档', path: null }, { name: '图片', path: null }]).map(function (loc) {
      return '<button class="location" data-location="' + esc(loc.path || '') + '">' + folderIconSvg() + '<span>' + esc(loc.name) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-location]'), function (node) {
      node.addEventListener('click', function () {
        var p = node.getAttribute('data-location');
        if (!p) return;
        state.path = p;
        state.query = '';
        state.kind = 'all';
        state.fileType = 'all';
        state.size = 'any';
        state.date = 'any';
        $('searchInput').value = '';
        $('btnClear').classList.add('hidden');
        $('pathLabel').textContent = p.split(/[\\/]/).filter(Boolean).pop() || p;
        $('pathClear').classList.remove('hidden');
        updateChips();
        updateStar();
        runSearch(true);
      });
    });
  }
  function renderSavedChips() {
    var el = $('savedSearches');
    if (!el) return;
    if (!state.saved.length) { el.innerHTML = '<span class="hint">还没有收藏搜索</span>'; return; }
    el.innerHTML = state.saved.map(function (s) {
      return '<span class="query-chip" data-saved="' + esc(s.id) + '"><span class="q-text">' + esc(s.name || s.query || '全部文件') + '</span><button class="q-remove" data-remove-saved="' + esc(s.id) + '" title="删除收藏">×</button></span>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-saved]'), function (node) {
      node.addEventListener('click', function (e) {
        if (e.target.closest('[data-remove-saved]')) return;
        var s = state.saved.find(function (x) { return x.id === node.getAttribute('data-saved'); });
        if (s) applySnapshot(s);
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-remove-saved]'), function (node) {
      node.addEventListener('click', function (e) { e.stopPropagation(); removeSaved(node.getAttribute('data-remove-saved')); });
    });
  }
  function renderRecentChips() {
    var el = $('recentSearches');
    if (!el) return;
    if (!state.recent.length) { el.innerHTML = '<span class="hint">搜索后会出现在这里</span>'; return; }
    el.innerHTML = state.recent.map(function (r) {
      return '<button class="query-chip" data-recent-id="' + esc(r.id) + '"><span class="q-text">' + esc(r.query || (r.path ? prettyPathName(r.path) : '全部文件')) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-recent-id]'), function (node) {
      node.addEventListener('click', function () {
        var r = state.recent.find(function (x) { return x.id === node.getAttribute('data-recent-id'); });
        if (r) applySnapshot(r);
      });
    });
  }

  // ---------- filters ----------

  function updateChips() {
    Array.prototype.forEach.call($('typeChips').querySelectorAll('.chip'), function (chip) {
      var type = chip.getAttribute('data-type');
      var active = false;
      if (type === 'all') active = state.kind === 'all' && state.fileType === 'all';
      else if (type === 'files') active = state.kind === 'files' && state.fileType === 'all';
      else if (type === 'folders') active = state.kind === 'folders' && state.fileType === 'all';
      else active = state.kind === 'files' && state.fileType === type;
      chip.classList.toggle('active', active);
    });
    $('sizeFilter').value = state.size;
    $('dateFilter').value = state.date;
    $('sortSelect').value = state.sort;
    $('pathLabel').textContent = state.path ? (state.path.split(/[\\/]/).filter(Boolean).pop() || state.path) : '所有位置';
    $('pathClear').classList.toggle('hidden', !state.path);
    $('btnClear').classList.toggle('hidden', !state.query);
    updateStar();
  }

  function setTypeChip(value) {
    if (value === 'all') { state.kind = 'all'; state.fileType = 'all'; }
    else if (value === 'files') { state.kind = 'files'; state.fileType = 'all'; }
    else if (value === 'folders') { state.kind = 'folders'; state.fileType = 'all'; }
    else { state.kind = 'files'; state.fileType = value; }
    updateChips();
    runSearch(true);
  }

  // ---------- keyboard / events ----------

  function isTyping() {
    var el = document.activeElement;
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  }

  function bindEvents() {
    $('searchInput').addEventListener('input', function (e) {
      state.query = e.currentTarget.value;
      $('btnClear').classList.toggle('hidden', !state.query);
      updateStar();
      if (!hasCriteria()) { showWelcome(); return; }
      scheduleSearch(true, 110);
    });
    $('searchInput').addEventListener('focus', function () { $('searchBox').classList.add('focused'); });
    $('searchInput').addEventListener('blur', function () { $('searchBox').classList.remove('focused'); });
    $('btnClear').addEventListener('click', function () {
      state.query = '';
      $('searchInput').value = '';
      $('btnClear').classList.add('hidden');
      updateStar();
      if (!hasCriteria()) showWelcome(); else runSearch(true);
      $('searchInput').focus();
    });
    $('focusHint').addEventListener('click', function () { $('searchInput').focus(); });

    $('statusPill').addEventListener('click', checkStatus);
    $('btnRetryStatus') && $('btnRetryStatus').addEventListener('click', checkStatus);

    Array.prototype.forEach.call($('typeChips').querySelectorAll('.chip'), function (chip) {
      chip.addEventListener('click', function () { setTypeChip(chip.getAttribute('data-type')); });
    });
    $('sizeFilter').addEventListener('change', function (e) { state.size = e.currentTarget.value; runSearch(true); });
    $('dateFilter').addEventListener('change', function (e) { state.date = e.currentTarget.value; runSearch(true); });
    $('sortSelect').addEventListener('change', function (e) { state.sort = e.currentTarget.value; if (hasCriteria()) runSearch(true); });
    $('pathFilter').addEventListener('click', async function () {
      try {
        var folder = await vibekit.file.selectFolder();
        if (folder) {
          state.path = folder;
          updateChips();
          runSearch(true);
        }
      } catch (e) { toast('选择文件夹失败：' + e.message, 'warn'); }
    });
    $('pathClear').addEventListener('click', function () {
      state.path = null;
      updateChips();
      if (hasCriteria()) runSearch(true); else showWelcome();
    });
    $('btnSaveSearch').addEventListener('click', saveSearch);

    $('btnLoadMore').addEventListener('click', function () { if (state.hasMore && !state.loading) runSearch(false); });
    $('resultsScroll').addEventListener('scroll', function () {
      if (!state.hasMore || state.loading) return;
      var el = $('resultsScroll');
      if (el.scrollHeight - el.scrollTop - el.clientHeight < 140) runSearch(false);
    });

    $('btnOpen').addEventListener('click', openSelected);
    $('btnReveal').addEventListener('click', revealSelected);
    $('btnCopyPath').addEventListener('click', function () { copyPath(selectedItem()); });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('#ctxMenu') && !e.target.closest('.result-row')) hideContextMenu();
    });
    window.addEventListener('blur', hideContextMenu);

    window.addEventListener('keydown', function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        $('searchInput').focus();
        $('searchInput').select();
        return;
      }
      if (e.key === '/' && !isTyping()) {
        e.preventDefault();
        $('searchInput').focus();
        return;
      }
      if (isTyping() && document.activeElement !== $('searchInput')) return;
      if (e.key === 'ArrowDown') {
        if (state.results.length) {
          e.preventDefault();
          selectIndex(Math.min(state.results.length - 1, state.selected + 1));
        }
        return;
      }
      if (e.key === 'ArrowUp') {
        if (state.results.length) {
          e.preventDefault();
          selectIndex(Math.max(0, state.selected - 1));
        }
        return;
      }
      if (e.key === 'Enter') {
        if (!state.results.length) return;
        e.preventDefault();
        if (state.selected < 0) selectIndex(0, false);
        if (mod) revealSelected(); else openSelected();
        return;
      }
      if (mod && e.key.toLowerCase() === 'c' && !isTyping() && state.selected >= 0) {
        e.preventDefault();
        copyPath(selectedItem());
      }
    });
  }

  // ---------- context menu ----------

  function showContextMenu(x, y, index) {
    activeMenuIndex = index;
    var menu = $('ctxMenu');
    menu.innerHTML =
      '<button data-act="open">打开</button>'
      + '<button data-act="reveal">在资源管理器中显示</button>'
      + '<div class="sep"></div>'
      + '<button data-act="copy-path">复制路径</button>'
      + '<button data-act="copy-name">复制名称</button>';
    menu.classList.remove('hidden');
    var rect = menu.getBoundingClientRect();
    menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + 'px';
    Array.prototype.forEach.call(menu.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () {
        var item = state.results[activeMenuIndex];
        hideContextMenu();
        if (!item) return;
        var act = btn.getAttribute('data-act');
        if (act === 'open') vibekit.shell.openPath(item.fullPath).catch(function (e) { toast('打开失败：' + e.message); });
        else if (act === 'reveal') vibekit.search.reveal(item.fullPath).catch(function (e) { toast('定位失败：' + e.message); });
        else if (act === 'copy-path') vibekit.clipboard.write(item.fullPath).then(function () { toast('路径已复制', 'ok'); });
        else if (act === 'copy-name') vibekit.clipboard.write(item.name).then(function () { toast('名称已复制', 'ok'); });
      });
    });
  }
  function hideContextMenu() { $('ctxMenu').classList.add('hidden'); activeMenuIndex = -1; }

  // ---------- init ----------

  function init() {
    bindEvents();
    loadSaved();
    checkStatus();
    updateChips();
    showWelcome();
  }

  init();
})();
</script>
</body>
</html>
