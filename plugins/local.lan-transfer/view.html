<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent: #6366f1; --accent-glow: rgba(99,102,241,0.35); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; color: #e8e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; }
  body { height: 100vh; overflow: hidden; }
  .app { height: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; -webkit-app-region: drag; }
  .top h1 { font-size: 16px; font-weight: 600; }
  .status { font-size: 11px; color: #8d8da8; -webkit-app-region: no-drag; }
  .status.on { color: #34d399; }
  .card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #9b9bb4; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .row label { font-size: 12px; color: #b8b8cc; min-width: 64px; }
  .muted { font-size: 11px; color: #77778d; }
  .hint { font-size: 11px; color: #77778d; line-height: 1.5; margin-top: 8px; }
  input { flex: 1; min-width: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e8f0; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-family: inherit; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  button { background: rgba(255,255,255,0.07); color: #dedef0; border: 1px solid rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.12); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { box-shadow: 0 0 16px var(--accent-glow); }
  button.danger { color: #fca5a5; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .device { border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.025); border-radius: 10px; padding: 10px; cursor: pointer; }
  .device:hover { border-color: rgba(255,255,255,0.2); }
  .device.selected { border-color: var(--accent); background: rgba(99,102,241,0.12); }
  .device .name { font-size: 13px; font-weight: 600; }
  .device .meta { font-size: 10px; color: #85859d; margin-top: 4px; }
  .empty { font-size: 12px; color: #77778d; padding: 10px 0; }
  .progress-item { border-top: 1px solid rgba(255,255,255,0.06); padding: 9px 0; }
  .progress-item:first-child { border-top: none; padding-top: 0; }
  .progress-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #b8b8cc; }
  .bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #a855f7); border-radius: 999px; transition: width 0.15s; }
  .error { color: #fca5a5; font-size: 10px; margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(10px); background: rgba(20,20,35,0.95); border: 1px solid rgba(255,255,255,0.12); color: #eee; padding: 8px 14px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>局域网传文件</h1>
    <span class="status" id="status">未启用</span>
  </div>

  <div class="card">
    <h2>设备</h2>
    <div class="row">
      <label>本机名</label>
      <input id="deviceName" placeholder="设备名称">
      <button id="saveName">保存</button>
      <button id="toggle">启用</button>
    </div>
    <div class="row">
      <label>接收目录</label>
      <span class="muted" id="downloadDir">默认 Downloads/VibeKit Transfer</span>
      <button id="pickDir">选择</button>
      <span class="muted" id="trustedCount"></span>
      <button id="clearTrusted" class="danger">清除信任</button>
    </div>
    <p class="hint">首次启用 Windows 会弹出防火墙提示，请允许“专用网络”。接收方需要确认，信任设备后会自动接收。</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-top: 0;">
      <h2 style="margin: 0;">在线设备</h2>
      <button id="refresh">刷新</button>
    </div>
    <div id="devices" class="devices"></div>
  </div>

  <div class="card">
    <h2>发送</h2>
    <div class="row">
      <button id="pickFiles">选择文件</button>
      <button id="pickFolders">选择文件夹</button>
      <button id="send" class="primary" disabled>发送给选中设备</button>
    </div>
    <div class="muted" id="selected">未选择文件</div>
  </div>

  <div class="card">
    <h2>进度</h2>
    <div id="progress"><div class="empty">暂无传输</div></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-top: 0;">
      <h2 style="margin: 0;">历史</h2>
      <button id="clearHistory" class="danger">清空</button>
    </div>
    <div id="history"><div class="empty">暂无历史</div></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="app://__vibekit__/bridge.js?pluginId=local.lan-transfer"></script>
<script>
var config = null;
var devices = [];
var selectedDevice = null;
var selectedPaths = [];
var transfers = {};
var history = [];

var $ = function (id) { return document.getElementById(id); };
function toast(message) {
  var el = $('toast');
  el.textContent = message;
  el.className = 'toast show';
  setTimeout(function () { el.className = 'toast'; }, 2200);
}
function fmtBytes(bytes) {
  if (!bytes || bytes < 0) return '0 B';
  var units = ['B','KB','MB','GB','TB'], i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
}
function timeAgo(ts) {
  var d = Date.now() - ts;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  return Math.floor(d / 3600000) + ' 小时前';
}

function renderConfig() {
  if (!config) return;
  $('deviceName').value = config.deviceName || '';
  $('downloadDir').textContent = config.downloadDir || '默认 Downloads/VibeKit Transfer';
  $('trustedCount').textContent = '信任 ' + (config.trustedDevices || []).length + ' 台';
  $('toggle').textContent = config.enabled ? '停用' : '启用';
  $('status').textContent = config.enabled ? '已启用 · ' + config.deviceName : '未启用';
  $('status').className = 'status' + (config.enabled ? ' on' : '');
}

function renderDevices() {
  var el = $('devices');
  if (!devices.length) {
    el.innerHTML = '<div class="empty">' + (config && config.enabled ? '正在搜索局域网设备…' : '启用后发现设备') + '</div>';
    return;
  }
  el.innerHTML = devices.map(function (device) {
    var selected = selectedDevice && selectedDevice.id === device.id ? ' selected' : '';
    return '<div class="device' + selected + '" data-id="' + device.id + '">'
      + '<div class="name">' + escapeHtml(device.name) + '</div>'
      + '<div class="meta">' + escapeHtml(device.address) + ':' + device.port + '</div>'
      + '<div class="meta">' + timeAgo(device.lastSeen) + '</div>'
      + '</div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('.device'), function (node) {
    node.addEventListener('click', function () {
      var id = node.getAttribute('data-id');
      selectedDevice = devices.filter(function (device) { return device.id === id; })[0] || null;
      renderDevices();
      renderSelected();
    });
  });
}

function renderSelected() {
  var send = $('send');
  send.disabled = !selectedDevice || selectedPaths.length === 0;
  if (!selectedPaths.length) {
    $('selected').textContent = '未选择文件';
  } else {
    var names = selectedPaths.slice(0, 4).map(function (p) { return p.split(/[\\/]/).pop(); });
    $('selected').textContent = '已选 ' + selectedPaths.length + ' 项：' + names.join('、') + (selectedPaths.length > 4 ? '…' : '') + (selectedDevice ? ' → ' + selectedDevice.name : '');
  }
}

function renderProgress() {
  var ids = Object.keys(transfers);
  if (!ids.length) { $('progress').innerHTML = '<div class="empty">暂无传输</div>'; return; }
  ids.sort(function (a, b) { return (transfers[b].updatedAt || 0) - (transfers[a].updatedAt || 0); });
  $('progress').innerHTML = ids.map(function (id) {
    var t = transfers[id];
    var pct = t.total ? Math.min(100, Math.round(t.bytes / t.total * 100)) : 0;
    var state = t.state === 'done' ? '完成' : t.state === 'error' ? '失败' : t.state === 'cancelled' ? '已取消' : t.state === 'offering' ? '等待接收' : '传输中';
    var label = (t.direction === 'send' ? '发送 → ' : '接收 ← ') + (t.deviceName || '') + ' · ' + (t.filesDone || 0) + '/' + (t.filesTotal || 0) + ' 个文件 · ' + fmtBytes(t.bytes || 0) + ' / ' + fmtBytes(t.total || 0);
    var cancel = t.state === 'transferring' || t.state === 'offering' ? ' <button class="danger" data-cancel="' + id + '">取消</button>' : '';
    return '<div class="progress-item"><div class="progress-head"><span>' + escapeHtml(t.currentFile || label) + '</span><span>' + state + cancel + '</span></div>'
      + '<div class="bar"><span style="width:' + pct + '%"></span></div>'
      + (t.error ? '<div class="error">' + escapeHtml(t.error) + '</div>' : '')
      + '</div>';
  }).join('');
  Array.prototype.forEach.call($('progress').querySelectorAll('[data-cancel]'), function (node) {
    node.addEventListener('click', function () {
      var id = node.getAttribute('data-cancel');
      vibekit.lan.cancel(id).catch(function (e) { toast('取消失败: ' + e.message); });
    });
  });
}

function renderHistory() {
  if (!history.length) { $('history').innerHTML = '<div class="empty">暂无历史</div>'; return; }
  $('history').innerHTML = history.slice(0, 12).map(function (h) {
    return '<div class="progress-item"><div class="progress-head"><span>' + (h.direction === 'send' ? '发送 → ' : '接收 ← ') + escapeHtml(h.deviceName || '') + ' · ' + (h.filesTotal || 0) + ' 个文件</span><span>' + (h.state === 'done' ? '完成' : h.state === 'error' ? '失败' : '已取消') + '</span></div><div class="meta muted">' + new Date(h.time).toLocaleString() + ' · ' + fmtBytes(h.bytes || 0) + '</div>' + (h.error ? '<div class="error">' + escapeHtml(h.error) + '</div>' : '') + '</div>';
  }).join('');
}

function addHistory(progress) {
  if (history.some(function (h) { return h.transferId === progress.transferId && h.time === progress.updatedAt; })) return;
  progress.updatedAt = Date.now();
  history.unshift({ transferId: progress.transferId, time: progress.updatedAt, direction: progress.direction, deviceName: progress.deviceName, filesTotal: progress.filesTotal, bytes: progress.bytes, state: progress.state, error: progress.error });
  history = history.slice(0, 50);
  vibekit.storage.set('history', history).catch(function () {});
  renderHistory();
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function refreshDevices() {
  try {
    devices = await vibekit.lan.getDevices();
    if (selectedDevice) selectedDevice = devices.filter(function (d) { return d.id === selectedDevice.id; })[0] || null;
    renderDevices();
    renderSelected();
  } catch (e) { toast('读取设备失败: ' + e.message); }
}

async function load() {
  try {
    config = await vibekit.lan.getConfig();
    renderConfig();
    if (config.enabled) {
      try { config = await vibekit.lan.enable(); renderConfig(); } catch (e) { toast('启动失败: ' + e.message); }
    }
    await refreshDevices();
    try { var saved = await vibekit.storage.get('history'); if (Array.isArray(saved)) history = saved; } catch (e) {}
    renderHistory();
  } catch (e) {
    toast('局域网插件不可用: ' + e.message);
  }
}

vibekit.events.onDevices(function (list) { devices = list || []; renderDevices(); });
vibekit.events.onProgress(function (progress) {
  if (!progress) return;
  progress.updatedAt = Date.now();
  transfers[progress.transferId] = progress;
  renderProgress();
});
vibekit.events.onComplete(function (progress) {
  if (!progress) return;
  addHistory(progress);
});
vibekit.events.onIncoming(function (incoming) {
  if (incoming) toast((incoming.deviceName || '设备') + ' 想发送 ' + (incoming.filesTotal || 0) + ' 个文件');
});
vibekit.events.onError(function (progress) {
  if (progress && progress.error) toast(progress.error);
});

$('saveName').addEventListener('click', async function () {
  try { config = await vibekit.lan.setConfig({ deviceName: $('deviceName').value.trim() }); renderConfig(); toast('设备名已保存'); }
  catch (e) { toast('保存失败: ' + e.message); }
});
$('pickDir').addEventListener('click', async function () {
  try {
    var paths = await vibekit.lan.pickPaths('folders');
    if (paths[0]) { config = await vibekit.lan.setConfig({ downloadDir: paths[0].path }); renderConfig(); toast('接收目录已更新'); }
  } catch (e) { toast('选择失败: ' + e.message); }
});
$('clearTrusted').addEventListener('click', async function () {
  try { config = await vibekit.lan.setConfig({ trustedDevices: [] }); renderConfig(); toast('已清除信任设备'); }
  catch (e) { toast('操作失败: ' + e.message); }
});
$('toggle').addEventListener('click', async function () {
  try {
    if (config && config.enabled) {
      await vibekit.lan.disable();
      config.enabled = false;
      renderConfig();
      toast('已停用局域网传输');
    } else {
      config = await vibekit.lan.enable();
      renderConfig();
      await refreshDevices();
      toast('已启用，等待设备发现');
    }
  } catch (e) { toast('操作失败: ' + e.message); }
});
$('refresh').addEventListener('click', refreshDevices);
$('pickFiles').addEventListener('click', async function () {
  try {
    var paths = await vibekit.lan.pickPaths('files');
    selectedPaths = paths.map(function (p) { return p.path; });
    renderSelected();
  } catch (e) { toast('选择文件失败: ' + e.message); }
});
$('pickFolders').addEventListener('click', async function () {
  try {
    var paths = await vibekit.lan.pickPaths('folders');
    selectedPaths = paths.map(function (p) { return p.path; });
    renderSelected();
  } catch (e) { toast('选择文件夹失败: ' + e.message); }
});
$('send').addEventListener('click', async function () {
  if (!selectedDevice || !selectedPaths.length) return;
  try {
    var result = await vibekit.lan.send(selectedDevice.id, selectedPaths);
    transfers[result.transferId] = { transferId: result.transferId, direction: 'send', deviceName: selectedDevice.name, state: 'offering', bytes: 0, total: 0, filesDone: 0, filesTotal: 0, updatedAt: Date.now() };
    renderProgress();
    selectedPaths = [];
    renderSelected();
  } catch (e) { toast('发送失败: ' + e.message); }
});
$('clearHistory').addEventListener('click', function () {
  history = [];
  vibekit.storage.set('history', []).catch(function () {});
  renderHistory();
});

load();
</script>
</body>
</html>
