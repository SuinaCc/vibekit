<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-light: #a5b4fc;
    --accent-glow: rgba(99,102,241,.35);
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --text: #f1f2f8;
    --text-2: #a9abc2;
    --muted: #7c7e96;
    --border: rgba(255,255,255,.075);
    --surface: rgba(255,255,255,.035);
    --surface-2: rgba(255,255,255,.06);
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent; color: var(--text);
    font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { height: 100vh; overflow: hidden; }
  .app {
    height: 100%; overflow-y: auto; padding: 28px 18px 24px;
    background:
      radial-gradient(900px 420px at 50% -12%, rgba(99,102,241,.16), transparent 70%),
      radial-gradient(620px 320px at 105% 8%, rgba(139,92,246,.08), transparent 62%);
    scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
  }
  .app::-webkit-scrollbar { width: 8px; }
  .app::-webkit-scrollbar-thumb { background: rgba(99,102,241,.4); border-radius: 4px; }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  h1 { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(6px);
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 14px; letter-spacing: .04em; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .stat .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .num small { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 2px; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .now-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px; margin-top: 12px;
  }
  .now-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 3px rgba(52,211,153,.18); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 50% { opacity: .45; } }
  .now-text { min-width: 0; font-size: 13px; }
  .now-text b { color: var(--accent-light); }
  .now-title { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  /* hour distribution */
  .hours { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding: 4px 2px 0; }
  .hour-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 100%; position: relative; }
  .hour-bar {
    width: 100%; border-radius: 4px 4px 2px 2px; min-height: 2px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    opacity: .85; transition: opacity .15s;
  }
  .hour-bar.peak { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
  .hour-col:hover .hour-bar { opacity: 1; }
  .hour-labels { display: flex; gap: 3px; margin-top: 6px; }
  .hour-labels span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hours-tip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: rgba(20,21,40,.95); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 9px; font-size: 10px; color: var(--text); white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5;
  }
  .hour-col:hover .hours-tip { opacity: 1; }

  /* category donut */
  .cat-flex { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .donut-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
  .donut-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .donut-center .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .donut-center .lbl { font-size: 10px; color: var(--muted); }
  .cat-legend { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px; }
  .cat-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .cat-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .cat-name { width: 72px; color: var(--text-2); }
  .cat-barwrap { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .cat-bar { height: 100%; border-radius: 3px; }
  .cat-min { width: 64px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* app ranking */
  .rank-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 12px; cursor: default; transition: background .15s;
  }
  .rank-row:hover { background: var(--surface-2); }
  .rank-idx { width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted); flex-shrink: 0; }
  .rank-row:nth-child(1) .rank-idx { background: rgba(99,102,241,.25); color: var(--accent-light); }
  .rank-row:nth-child(2) .rank-idx { background: rgba(99,102,241,.16); color: var(--accent-light); }
  .rank-row:nth-child(3) .rank-idx { background: rgba(99,102,241,.09); }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .rank-cat { font-size: 10px; padding: 1px 7px; border-radius: 99px; font-weight: 500; }
  .rank-title { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .rank-barwrap { width: 130px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .rank-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .rank-min { width: 68px; text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* 7-day trend */
  .trend { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 4px; }
  .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .trend-stack { width: 100%; max-width: 42px; display: flex; flex-direction: column-reverse; border-radius: 6px; overflow: hidden; }
  .trend-seg { width: 100%; }
  .trend-day { font-size: 10px; color: var(--muted); }
  .trend-min { font-size: 10px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* goal */
  .goal-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .goal-row input[type="number"] {
    width: 90px; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 13px; outline: none;
  }
  .goal-row input[type="number"]:focus { border-color: var(--accent); }
  .btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-light); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; font-weight: 600; }
  .btn.primary:hover { opacity: .9; color: #fff; }

  .footer { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0 2px; }
  .badge-live {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--success);
    background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.25); padding: 2px 9px; border-radius: 99px;
  }
  .badge-live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
</style>
</head>
<body>
<div class="app">
  <div class="wrap">

    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <h1>⏱ 屏幕足迹</h1>
        <span class="badge-live"><span class="dot"></span>实时记录中</span>
      </div>
      <div class="sub">自动记录前台应用使用时长 · 数据仅存本机 <code style="color:var(--accent-light)">~/.vibekit</code> · 保留 90 天</div>
    </div>

    <!-- 今日总览 -->
    <div class="card">
      <h2>今日总览 <span id="dateLabel" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="stats">
        <div class="stat"><div class="num" id="stTotal">--<small>分钟</small></div><div class="lbl">今日屏幕时间</div></div>
        <div class="stat"><div class="num" id="stApps">--</div><div class="lbl">使用过的应用</div></div>
        <div class="stat"><div class="num" id="stPeak">--:--</div><div class="lbl">最专注的时段</div></div>
        <div class="stat"><div class="num" id="stStreak">--<small>天</small></div><div class="lbl">连续记录</div></div>
      </div>
      <div class="now-box">
        <span class="now-dot" id="nowDot"></span>
        <div class="now-text" style="flex:1;min-width:0">
          <div>正在使用：<b id="nowApp">--</b></div>
          <div class="now-title" id="nowTitle"></div>
        </div>
      </div>
    </div>

    <!-- 小时分布 -->
    <div class="card">
      <h2>今日小时分布 <span style="color:var(--muted);font-weight:400">· 悬停查看分钟数，金色为峰值</span></h2>
      <div class="hours" id="hours"></div>
      <div class="hour-labels" id="hourLabels"></div>
    </div>

    <div class="row">
      <!-- 分类占比 -->
      <div class="card" style="flex:1;min-width:340px">
        <h2>分类占比</h2>
        <div class="cat-flex">
          <div class="donut-wrap">
            <svg id="donut" viewBox="0 0 42 42" style="width:100%;height:100%"></svg>
            <div class="donut-center"><div class="num" id="donutTotal">--</div><div class="lbl">分钟</div></div>
          </div>
          <div class="cat-legend" id="catLegend"></div>
        </div>
      </div>

      <!-- 7 天趋势 -->
      <div class="card" style="flex:1;min-width:340px">
        <h2>近 7 天趋势 <span style="color:var(--muted);font-weight:400">· 按分类堆叠</span></h2>
        <div class="trend" id="trend"></div>
      </div>
    </div>

    <!-- 应用排行 -->
    <div class="card">
      <h2>应用排行 <span style="color:var(--muted);font-weight:400">· Top 15</span></h2>
      <div id="rankList"></div>
    </div>

    <!-- 目标设置 -->
    <div class="card">
      <h2>设置</h2>
      <div class="goal-row">
        <span style="font-size:13px;color:var(--text-2)">每日屏幕时间目标</span>
        <input type="number" id="goalInput" min="0" max="1440" step="30" value="0">
        <span style="font-size:12px;color:var(--muted)">分钟（0 = 不设目标）</span>
        <button class="btn primary" id="goalSave">保存</button>
        <button class="btn" id="excludeBtn">排除应用…</button>
      </div>
      <div id="excludeList" style="margin-top:10px;display:none;flex-wrap:wrap;gap:8px"></div>
    </div>

    <div class="footer">屏幕足迹 · 全程本地运行，不上传任何数据 · VibeKit</div>
  </div>
</div>
<script src="app://__vibekit__/bridge.js"></script>
<script>
(function () {
  'use strict';
  var CAT_META = {
    ide:      { label: '编程开发', color: '#818cf8' },
    browser:  { label: '浏览器',   color: '#60a5fa' },
    chat:     { label: '聊天沟通', color: '#34d399' },
    docs:     { label: '文档办公', color: '#fbbf24' },
    media:    { label: '影音娱乐', color: '#f87171' },
    game:     { label: '游戏',     color: '#fb923c' },
    design:   { label: '设计创作', color: '#e879f9' },
    terminal: { label: '终端',     color: '#94a3b8' },
    vibekit:  { label: 'VibeKit',  color: '#a5b4fc' },
    other:    { label: '其他',     color: '#7c7e96' },
  };
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtMin(m) {
    if (m >= 60) {
      var h = Math.floor(m / 60), mm = m % 60;
      return h + ' 小时' + (mm ? ' ' + mm + ' 分' : '');
    }
    return m + ' 分钟';
  }
  function shortMin(m) {
    if (m >= 60) { var h = (m / 60); return (h >= 10 ? Math.round(h) : h.toFixed(1)) + 'h'; }
    return m + 'm';
  }
  var api = window.vibekit && window.vibekit.screentime;
  if (!api) {
    document.body.innerHTML = '<div style="padding:24px;font-family:inherit"><div style="background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);border-radius:14px;padding:16px 18px;color:#f87171;font-size:13px;line-height:1.7"><b>Bridge 未就绪</b><br>找不到 window.vibekit.screentime —— 主进程可能是旧版本。请完全退出并重启 VibeKit（如运行打包版需重新打包）。</div></div>';
    return;
  }
  function showError(msg) {
    var host = document.querySelector('.wrap');
    var old = document.getElementById('errBanner');
    if (old) old.remove();
    if (!msg) return;
    var div = document.createElement('div');
    div.id = 'errBanner';
    div.style.cssText = 'background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);border-radius:14px;padding:12px 16px;color:#f87171;font-size:12px;line-height:1.6';
    div.textContent = '加载失败：' + msg + '（请确认已重启 VibeKit 使新版本生效）';
    host.insertBefore(div, host.firstChild);
  }

  var settings = { goalMinutes: 0, excludedExes: [] };

  function renderHours(byHour) {
    var max = Math.max.apply(null, byHour.concat([1]));
    var peakIdx = 0, peakVal = -1;
    byHour.forEach(function (v, i) { if (v > peakVal) { peakVal = v; peakIdx = i; } });
    var host = $('hours');
    var html = '';
    for (var i = 0; i < 24; i++) {
      var pct = byHour[i] > 0 ? Math.max(4, Math.round(byHour[i] / max * 100)) : 0;
      var tip = byHour[i] > 0 ? i + ':00–' + (i + 1) + ':00 · ' + fmtMin(byHour[i]) : i + ':00 · 无使用';
      html += '<div class="hour-col">' +
        '<div class="hours-tip">' + esc(tip) + '</div>' +
        (pct ? '<div class="hour-bar' + (i === peakIdx ? ' peak' : '') + '" style="height:' + pct + '%"></div>' : '') +
        '</div>';
    }
    host.innerHTML = html;
    var labels = '';
    for (var j = 0; j < 24; j++) labels += '<span>' + (j % 3 === 0 ? j : '·') + '</span>';
    $('hourLabels').innerHTML = labels;
    return peakIdx;
  }

  function renderDonut(byCategory, total) {
    var C = 2 * Math.PI * 15.9155;
    var offset = 0;
    var svg = '';
    byCategory.forEach(function (c) {
      var meta = CAT_META[c.category] || CAT_META.other;
      var frac = total > 0 ? c.minutes / total : 0;
      var len = frac * C;
      svg += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + meta.color + '" stroke-width="5.5" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '" stroke-linecap="butt" transform="rotate(-90 21 21)"/>';
      offset += len;
    });
    if (!byCategory.length) {
      svg = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="5.5"/>';
    }
    $('donut').innerHTML = svg;
    $('donutTotal').textContent = total >= 60 ? (total / 60).toFixed(1) + 'h' : total + 'm';

    var legend = '';
    byCategory.slice(0, 8).forEach(function (c) {
      var meta = CAT_META[c.category] || CAT_META.other;
      var pct = total > 0 ? Math.round(c.minutes / total * 100) : 0;
      legend += '<div class="cat-row">' +
        '<span class="cat-dot" style="background:' + meta.color + '"></span>' +
        '<span class="cat-name">' + esc(meta.label) + '</span>' +
        '<span class="cat-barwrap"><span class="cat-bar" style="width:' + pct + '%;background:' + meta.color + '"></span></span>' +
        '<span class="cat-min">' + fmtMin(c.minutes) + ' · ' + pct + '%</span></div>';
    });
    $('catLegend').innerHTML = legend || '<div style="color:var(--muted);font-size:12px">暂无数据</div>';
  }

  function renderRank(byApp) {
    var max = byApp.length ? byApp[0].minutes : 1;
    var html = '';
    byApp.forEach(function (app, i) {
      var meta = CAT_META[app.category] || CAT_META.other;
      var topTitle = app.titles && app.titles.length ? app.titles[0].title : '';
      html += '<div class="rank-row">' +
        '<span class="rank-idx">' + (i + 1) + '</span>' +
        '<div class="rank-info">' +
          '<div class="rank-name">' + esc(app.app) +
            '<span class="rank-cat" style="color:' + meta.color + ';background:' + meta.color + '22">' + esc(meta.label) + '</span>' +
          '</div>' +
          (topTitle ? '<div class="rank-title">' + esc(topTitle) + '</div>' : '') +
        '</div>' +
        '<span class="rank-barwrap"><span class="rank-bar" style="width:' + Math.round(app.minutes / max * 100) + '%"></span></span>' +
        '<span class="rank-min">' + fmtMin(app.minutes) + '</span>' +
        '</div>';
    });
    $('rankList').innerHTML = html || '<div style="color:var(--muted);font-size:12px;padding:8px 0">还没有记录，正常使用一会儿后刷新即可看到</div>';
  }

  function renderTrend(days) {
    var totalCats = {};
    days.forEach(function (d) {
      d.byCategory.forEach(function (c) { totalCats[c.category] = (totalCats[c.category] || 0) + c.minutes; });
    });
    var topCats = Object.keys(totalCats).sort(function (a, b) { return totalCats[b] - totalCats[a]; }).slice(0, 5);
    var max = 1;
    days.forEach(function (d) { if (d.totalMinutes > max) max = d.totalMinutes; });
    var html = '';
    var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    days.forEach(function (d) {
      var date = new Date(d.date + 'T00:00:00');
      var segs = '';
      var catMap = {};
      d.byCategory.forEach(function (c) { catMap[c.category] = c.minutes; });
      topCats.forEach(function (cat) {
        var m = catMap[cat] || 0;
        if (m <= 0) return;
        var meta = CAT_META[cat] || CAT_META.other;
        segs += '<div class="trend-seg" style="height:' + Math.max(3, Math.round(m / max * 88)) + '%;background:' + meta.color + '" title="' + esc(meta.label) + ' ' + fmtMin(m) + '"></div>';
      });
      html += '<div class="trend-col">' +
        '<span class="trend-min">' + (d.totalMinutes ? shortMin(d.totalMinutes) : '') + '</span>' +
        '<div class="trend-stack">' + (segs || '<div style="height:2px"></div>') + '</div>' +
        '<span class="trend-day">周' + dayNames[date.getDay()] + '</span></div>';
    });
    $('trend').innerHTML = html || '<div style="color:var(--muted);font-size:12px">数据积累中</div>';
  }

  function renderState(state) {
    settings = state.settings || settings;
    $('dateLabel').textContent = state.date;
    $('stTotal').innerHTML = state.totalMinutes >= 60
      ? Math.floor(state.totalMinutes / 60) + '<small>小时</small>' + (state.totalMinutes % 60 ? ' ' + (state.totalMinutes % 60) + '<small>分</small>' : '')
      : state.totalMinutes + '<small>分钟</small>';
    $('stApps').textContent = state.appCount;
    var peakIdx = renderHours(state.byHour || []);
    $('stPeak').textContent = (state.byHour || []).some(function (v) { return v > 0; })
      ? String(peakIdx).padStart(2, '0') + ':00'
      : '--:--';
    var active = state.currentApp && state.currentTitle !== null;
    $('nowDot').style.background = active ? '' : 'var(--muted)';
    $('nowApp').textContent = state.currentApp || '（无前台窗口）';
    $('nowTitle').textContent = state.currentTitle || '';
    $('nowTitle').style.display = state.currentTitle ? '' : 'none';
    renderDonut(state.byCategory || [], state.totalMinutes);
    renderRank(state.byApp || []);
    if (document.activeElement !== $('goalInput')) $('goalInput').value = settings.goalMinutes || 0;
    renderExcludes();
  }

  function renderExcludes() {
    var host = $('excludeList');
    if (host.style.display === 'none') return;
    var list = settings.excludedExes || [];
    if (!list.length) {
      host.innerHTML = '<span style="font-size:12px;color:var(--muted)">暂无排除应用。输入进程名（如 game.exe）加入后，其使用时长不再计入。</span>';
      return;
    }
    host.innerHTML = list.map(function (exe) {
      return '<span class="rank-cat" style="color:var(--text);background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;display:inline-flex;align-items:center;gap:6px;font-size:12px">' +
        esc(exe) + '<span data-del="' + esc(exe) + '" style="cursor:pointer;color:var(--danger);font-weight:700">×</span></span>';
    }).join('') +
    '<span style="display:inline-flex;gap:6px;align-items:center">' +
      '<input id="newExe" placeholder="进程名，如 steam" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 9px;font-size:12px;width:130px;outline:none">' +
      '<button class="btn" id="addExe" style="padding:5px 12px;font-size:12px">添加</button></span>';
    host.querySelectorAll('[data-del]').forEach(function (el) {
      el.addEventListener('click', function () {
        var exe = el.getAttribute('data-del');
        api.setSettings({ excludedExes: (settings.excludedExes || []).filter(function (x) { return x !== exe; }) })
          .then(function (s) { settings = s.settings || settings; renderExcludes(); })
          .catch(function () {});
      });
    });
    var addBtn = $('addExe');
    if (addBtn) addBtn.addEventListener('click', function () {
      var input = $('newExe');
      var v = (input.value || '').trim().toLowerCase();
      if (!v) return;
      var list2 = settings.excludedExes || [];
      if (list2.indexOf(v) < 0) list2 = list2.concat([v]);
      api.setSettings({ excludedExes: list2 }).then(function (s) {
        settings = s.settings || settings; renderExcludes();
      }).catch(function () {});
    });
  }

  $('goalSave').addEventListener('click', function () {
    var v = parseInt($('goalInput').value, 10) || 0;
    api.setSettings({ goalMinutes: v }).then(function (state) {
      settings = state.settings || settings;
      $('goalSave').textContent = '已保存 ✓';
      setTimeout(function () { $('goalSave').textContent = '保存'; }, 1500);
    }).catch(function (e) { alert((e && e.message) || '保存失败'); });
  });
  $('excludeBtn').addEventListener('click', function () {
    var host = $('excludeList');
    var showing = host.style.display !== 'none';
    host.style.display = showing ? 'none' : 'flex';
    if (!showing) renderExcludes();
  });

  var reportCache = null;
  function refreshAll() {
    Promise.all([api.getState(), api.getReport(7)]).then(function (rs) {
      showError(null);
      renderState(rs[0]);
      reportCache = rs[1];
      $('stStreak').innerHTML = (rs[1].streakDays || 0) + '<small>天</small>';
      renderTrend(rs[1].days || []);
    }).catch(function (e) {
      showError((e && (e.message || e.error)) || String(e));
    });
  }

  refreshAll();
  setInterval(refreshAll, 15000);
})();
</script>
</body>
</html>
