<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
:root{--accent:#6366f1;--accent-glow:rgba(99,102,241,0.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:transparent;color:var(--aero-text,#e8e8f0);padding:14px;height:100vh}
h2{font-size:16px;margin-bottom:14px;font-weight:600}
.card{padding:16px;border-radius:12px;background:var(--aero-surface,rgba(255,255,255,0.04));border:1px solid var(--aero-border,rgba(255,255,255,0.08));margin-bottom:10px}
.card-title{font-size:13px;font-weight:600;margin-bottom:4px}
.card-body{font-size:12px;color:var(--aero-text-2,#b9bbd1)}
.btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-family:inherit}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{opacity:0.85}
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:8px;background:rgba(34,197,94,0.2);color:#22c55e;font-size:12px;opacity:0;pointer-events:none;transition:opacity 0.3s}
.toast.show{opacity:1}
</style></head>
<body>
<h2>🎉 Hello Aero!</h2>
<div class="card">
  <div class="card-title">你的第一个插件已运行</div>
  <div class="card-body">这个插件通过 Bridge API 与 Aero 通信。打开 DevTools 查看 console。</div>
</div>
<button class="btn btn-accent" onclick="testStorage()">测试存储</button>
<div id="toast" class="toast"></div>

<script src="app://__aero__/bridge.js?pluginId=my.first-plugin"></script>
<script>
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast'},1500)}

// Use window.aero.storage for per-plugin persistence
async function testStorage(){
  var prev = await window.aero.storage.get('count') || 0;
  var next = prev + 1;
  await window.aero.storage.set('count', next);
  showToast('已存储: ' + next);
}
</script>
</body>
</html>
